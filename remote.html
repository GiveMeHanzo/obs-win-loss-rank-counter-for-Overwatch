<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBS 胜负控制台</title>
    <style>
        body { 
            background: rgb(15, 17, 21); color: white; font-family: sans-serif; 
            text-align: center; margin: 0; padding: 20px; 
            /* 阻止双击放大 */
            touch-action: manipulation;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        button { 
            padding: 35px 0; font-size: 26px; font-weight: bold; border: none; 
            border-radius: 15px; color: white; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.92); }
        /* 颜色与你的 OBS 画面保持一致 */
        .win { background: rgb(0, 222, 74); border: 4px solid rgb(63, 216, 114); }
        .lose { background: rgb(224, 45, 45); border: 4px solid rgb(232, 73, 73); }
        .rank { background: rgb(238, 155, 46); border: 4px solid rgb(255, 187, 98); }
        .clear { background: rgb(45, 143, 224); border: 4px solid rgb(73, 150, 232); width: 100%; grid-column: span 2;}
        #status { font-size: 14px; font-weight: bold; padding: 10px; background: #222; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>🎮 手机控制台</h2>
    <div id="status">🟡 正在连接电脑...</div>

    <div class="grid" id="controls" style="opacity: 0.3; pointer-events: none;">
        <button class="win" onclick="sendCmd('win+')">胜 +</button>
        <button class="win" onclick="sendCmd('win-')">胜 -</button>
        <button class="lose" onclick="sendCmd('lose+')">败 +</button>
        <button class="lose" onclick="sendCmd('lose-')">败 -</button>
        <button class="rank" onclick="sendCmd('rank+')">段位 +</button>
        <button class="rank" onclick="sendCmd('rank-')">段位 -</button>
        <button class="clear" onclick="sendCmd('clear')">清空胜负</button>
    </div>

    <script>
        let ws;
        function connect() {
            // 自动获取电脑的局域网 IP
            const ip = window.location.hostname;
            if (!ip) {
                document.getElementById('status').innerText = '🔴 请通过局域网IP访问此页面';
                return;
            }

            ws = new WebSocket('ws://' + ip + ':8765');

            ws.onopen = () => {
                document.getElementById('status').innerHTML = '🟢 已连接到 OBS';
                document.getElementById('status').style.color = '#00ff55';
                document.getElementById('controls').style.opacity = '1';
                document.getElementById('controls').style.pointerEvents = 'auto';
            };
            
            ws.onclose = () => {
                document.getElementById('status').innerHTML = '🔴 连接已断开，尝试重连...';
                document.getElementById('status').style.color = '#ff3333';
                document.getElementById('controls').style.opacity = '0.3';
                document.getElementById('controls').style.pointerEvents = 'none';
                setTimeout(connect, 3000);
            };
        }

        function sendCmd(cmd) {
            if(ws && ws.readyState === WebSocket.OPEN) {
                ws.send(cmd);
                // 触发手机震动（仅安卓和部分浏览器支持）
                if(navigator.vibrate) navigator.vibrate(40);
            }
        }

        // 页面打开时自动连接
        window.onload = connect;
    </script>
</body>
</html>
