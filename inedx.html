<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index-style.css">
    <link rel="icon" href="assets/hs.jpg">
    <title>Win/Lose Counter with Rank</title>
</head>
<body>
    <div class="counter-area" id="counter-area">
        <div class="counter-wrapper">
            <span>
                <p class="wins-text">胜场:</p>
                <div class="wins" id="wins">
                    0
                </div>
            </span>
            <span>
                <p class="losses-text">败场:</p>
                <div class="losses" id="losses">
                    0
                </div>
            </span>
            <span>
                <p class="rank-text">段位:</p>
                <div class="rank" id="rank-display">
                    铂金 1
                </div>
            </span>
        </div>
    </div>
    <div class="controls-wrapper">
        <div class="button-wrapper">
            <span>
                <button class="add-win" onclick='handleButtonPress("win+")'>胜 +</button>
                <button class="add-win" onclick='handleButtonPress("win-")'>胜 -</button>
            </span>
            <span>
                <button class="add-lose" onclick='handleButtonPress("lose+")'>败 +</button>
                <button class="add-lose" onclick='handleButtonPress("lose-")'>败 -</button>
            </span>
            <span>
                <button class="add-rank" onclick='handleButtonPress("rank+")'>段位 +</button>
                <button class="add-rank" onclick='handleButtonPress("rank-")'>段位 -</button>
            </span>
            <span class="clear-span">
                <button class="clear" onclick='handleButtonPress("clear")'>清空胜负</button>
            </span>
        </div>
    </div>
    <script src="js/counterController.js"></script>
</body>
</html>
